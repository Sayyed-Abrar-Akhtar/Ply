<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop — Ply</title><link rel="stylesheet" href="css/style.css"></head><body data-page="collection"><div id="header"></div><main class="section wrap"><p class="eyebrow">Ply / shop</p><div class="collection-head"><div><h1>New, women, men & accessories.</h1><p class="lede">Everyday pieces designed to work together without looking uniform.</p></div><div class="tools"><button class="filter-toggle" id="filterBtn" aria-expanded="false" aria-controls="filters"><span>Filter</span><span aria-hidden="true">+</span></button><div class="sort-icons" aria-label="Sort products"><button class="sort-icon" data-sort="featured" aria-pressed="true" title="Featured" aria-label="Sort by featured">✦</button><button class="sort-icon" data-sort="price-low" aria-pressed="false" title="Price low to high" aria-label="Sort price low to high">↑</button><button class="sort-icon" data-sort="price-high" aria-pressed="false" title="Price high to low" aria-label="Sort price high to low">↓</button><button class="sort-icon" data-sort="alpha" aria-pressed="false" title="Alphabetical" aria-label="Sort alphabetically">A–Z</button></div></div></div><div class="collection-layout"><aside class="filters" id="filters"><button id="filterClose" class="close">×</button><h2>Filter</h2><fieldset><legend>Category</legend><label><input type="checkbox" value="women" data-filter="category"> Women</label><label><input type="checkbox" value="men" data-filter="category"> Men</label><label><input type="checkbox" value="unisex" data-filter="category"> Unisex</label><label><input type="checkbox" value="accessories" data-filter="category"> Accessories</label></fieldset><fieldset><legend>Size</legend><label><input type="checkbox" value="XS" data-filter="size"> XS</label><label><input type="checkbox" value="S" data-filter="size"> S</label><label><input type="checkbox" value="M" data-filter="size"> M</label><label><input type="checkbox" value="L" data-filter="size"> L</label><label><input type="checkbox" value="XL" data-filter="size"> XL</label></fieldset><button id="clear" class="link-button">Clear all</button></aside><section><div id="grid" class="grid"></div><div id="pagination" class="pagination"></div></section></div></main><div id="footer"></div><div id="cart"></div><script type="module" src="js/app.js"></script></body></html>
